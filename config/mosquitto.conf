# Mosquitto Broker Configuration for WBAN Healthcare SDN Architecture
# QoS 1 is selected because physiological telemetry and life-critical alerts cannot tolerate silent packet loss under network congestion.

listener 1883 0.0.0.0
allow_anonymous true

# Persistence
persistence true
persistence_location data/mosquitto/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection limits
max_connections 1000
max_queued_messages 5000
